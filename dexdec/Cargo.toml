[workspace]
members = ["dexdec", "rusty-dex"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"

[profile.fast]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256

# Optimize DEX parsing and metadata decoding for core-library development.
[profile.dev]
opt-level = 1
incremental = true
codegen-units = 256
