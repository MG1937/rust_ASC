[package]
name = "rust_ASC"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:serde_json", "dep:schemars"]

[profile.release]
opt-level = 3           # max speed
lto = false             # avoid multi-minute whole-program LLVM linking
codegen-units = 16      # parallelize release code generation
incremental = true      # reuse optimized codegen across local rebuilds
strip = "symbols"       # remove debug symbols
panic = "abort"         # smaller binary, no unwind tables

[profile.release.package.dexdec]
opt-level = 1           # dexdec upstream's fast profile avoids pathological LLVM time
codegen-units = 16      # match the machine's parallelism without 256-object overhead

[profile.dev]
debug = true
opt-level = 0

[dependencies]
rmcp = { version = "3.5.1", optional = true, default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", optional = true, features = ["rt", "io-std", "time"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
schemars = { version = "1", optional = true }
# getclass keeps chunked flate2 decompression for cooperative early cancellation.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libdeflater = { version = "1.26.1", features = ["use_rust_alloc"] }
memmap2 = "0.9"
cesu8 = "1.1.0"
lazy_static = "1"
apk-info-axml = "1.0.13"
quick-xml = "0.36"
memchr = "2"
sha1 = "0.10"
adler2 = "2"
radguard = { path = "radguard" }
dexdec = { path = "dexdec/dexdec", default-features = false }
clap = "4"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
regex = "1"
tempfile = "3"
