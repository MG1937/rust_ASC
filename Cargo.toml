[package]
name = "rust_ASC"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3           # max speed
lto = "fat"             # full link-time optimization
codegen-units = 1       # single compilation unit, more inlining
strip = "symbols"       # remove debug symbols
panic = "abort"         # smaller binary, no unwind tables

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
# zlib-rs is flate2's faster pure-Rust DEFLATE backend. zip also enables
# miniz_oxide, but flate2 gives zlib-rs priority when both are selected.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9"
regex = "1"
lazy_static = "1"
apk-info-axml = "1.0.13"
quick-xml = "0.36"
memchr = "2"
