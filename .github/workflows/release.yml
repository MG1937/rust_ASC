name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: x64 is the primary desktop target; x86 and ARM64 cover
          # supported Windows desktop and Windows-on-ARM installations.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: rust_ASC-windows-x86_64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            asset_name: rust_ASC-windows-x86.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: rust_ASC-windows-aarch64.exe

          # Linux: native x86_64 plus the requested 32-bit x86, ARMv7, and
          # AArch64 GNU targets. cross supplies the matching container linker.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: rust_ASC-linux-x86_64
            cross: false
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            asset_name: rust_ASC-linux-x86
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            asset_name: rust_ASC-linux-armv7
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: rust_ASC-linux-aarch64
            cross: true

          # Publish the Apple Silicon macOS binary only.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: rust_ASC-macos-aarch64
            cross: false

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Stage raw release binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/rust_ASC${{ runner.os == 'Windows' && '.exe' || '' }}" "release-assets/${{ matrix.asset_name }}"

      - name: Upload raw release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download raw release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish raw binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
